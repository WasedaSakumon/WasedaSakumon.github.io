<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早稲田大学作問サークル問題集解答集</title>
    <link rel="stylesheet" href="https://wasedasakumon.github.io/style.css">
    <style>
        /*2026問題集に固有の装飾 */
        .search-form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0 30px;
        }

        .search-form select, .search-form button {
            padding: 10px 18px;
            font-size: 1em;
            border: 2px solid #990000;
            border-radius: 25px;
            background-color: white;
            color: #333;
            outline: none;
            box-sizing: border-box;
        }

        .search-form button {
            background-color: #990000;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .search-form button:hover {
            background-color: #770000;
        }

        .columns-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .column {
            flex: 1;
            min-width: 260px;
            max-width: 300px;
        }

        .column h4 {
            font-size: 1.1em;
            color: #222;
            border-bottom: 2px solid #990000;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .column-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .column-links a {
            padding: 8px 15px;
            border: 1.5px solid #990000;
            color: #990000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 20px;
            transition: background-color 0.3s, color 0.3s;
            font-size: 0.95em;
        }

        .column-links a:hover {
            background-color: #990000;
            color: white;
        }
    </style>
    </head>
<body>

    <h1>早稲田大学作問サークル</h1>

    <nav class="breadcrumb">
        <ol>
            <li><a href="../index.html">ホーム</a></li>
            <li><a href="./index.html">問題集解答</a></li>
            <li class="current-page">2026</li>
        </ol>
    </nav>

    <h2>2026年11月6日, 11月7日に開催された早稲田祭・理工展で販売した問題集の解答を掲示しています！ぜひご覧になってください！</h2>

    <hr>

    <h3>解答検索</h3>
    <p>科目名と問題番号を入力して解答ページを開きます。</p>

    <div class="search-form">
        <select id="subject-select" onchange="updateNumberOptions()">
            <option value="math">数学</option>
            <option value="sansu">算数・脳トレ</option>
            <option value="sonota">その他の科目</option>
        </select>

        <select id="number-select">
            <!-- JavaScriptで生成 -->
        </select>

        <button type="button" onclick="openSelectedAnswer()">決定</button>
    </div>

    <hr>

    <h3>リンクから開く</h3>
    <p>リンクを直接選んで解答ページを開きます。</p>

    <div class="columns-container">
        <div class="column">
            <h4>数学</h4>
            <div class="column-links" id="math-links"></div>
        </div>
        <div class="column">
            <h4>算数・脳トレ</h4>
            <div class="column-links" id="sansu-links"></div>
        </div>
        <div class="column">
            <h4>その他の科目</h4>
            <div class="column-links" id="sonota-links"></div>
        </div>
    </div>

    <script>
        const counts = {
            math: 35,
            sansu: 24,
            sonota: 25
        };

        function updateNumberOptions() {
            const subject = document.getElementById("subject-select").value;
            const numberSelect = document.getElementById("number-select");
            const max = counts[subject];

            numberSelect.innerHTML = "";
            for (let i = 1; i <= max; i++) {
                const option = document.createElement("option");
                option.value = i;
                option.textContent = `問題 ${i}`;
                numberSelect.appendChild(option);
            }
        }

        function openSelectedAnswer() {
            const subject = document.getElementById("subject-select").value;
            const number = document.getElementById("number-select").value;
            const pdfUrl = `2026/answer_${subject}_${number}.pdf`;
            window.open(pdfUrl, "_blank");
        }

        window.addEventListener("DOMContentLoaded", () => {
            updateNumberOptions();
           
            for (const subject of Object.keys(counts)) {
                const container = document.getElementById(subject + "-links");
                for (let i = 1; i <= counts[subject]; i++) {
                    const a = document.createElement("a");
                    a.href = `2026/answer_${subject}_${i}.pdf`;
                    a.target = "_blank";
                    a.textContent = `問題${i}解答`;
                    container.appendChild(a);
                }
            }

        });
    </script>
</body>
</html>
